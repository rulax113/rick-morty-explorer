<section class="characters-page">
    <div class="page-header">
      <h1>Bohaterowie <span class="count">({{ filteredCharacters.length }})</span></h1>
      <div class="header-actions">
        <input
          type="text"
          placeholder="Szukaj..."
          [value]="searchQuery"
          (input)="onSearchChange($event)"
          class="search-input"
        />
        <a routerLink="/characters/new" class="btn-add">+ Dodaj postać</a>
      </div>
    </div>
  
    @if (filteredCharacters.length === 0) {
      <app-empty-state [message]="'Brak wyników dla: ' + searchQuery" />
    } @else {
      <div class="cards-grid">
        @for (character of filteredCharacters; track character.id) {
          <app-item-card
            [character]="character"
            (selected)="onCardSelected($event)"
          />
        }
      </div>
    }
  </section>
